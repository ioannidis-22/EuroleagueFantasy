[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elfantasy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "requests", "openpyxl", "streamlit", "plotly"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real Euroleague API"]
